name: Build KSU kernel for star (Mi 11 Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source (miui-base)
        run: |
          git clone --depth 1 --branch miui-base https://github.com/EndCredits/android_kernel_xiaomi_sm8350-miui.git kernel
          cd kernel
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/star_defconfig
          wget -q https://codeload.github.com/tiann/KernelSU/tar.gz/refs/tags/v3.2.5 -O ksu.tar.gz
          tar -xzf ksu.tar.gz
          rm -rf drivers/kernelsu; mkdir -p drivers/kernelsu
          cp -r KernelSU-*/kernel/. drivers/kernelsu/
          cp -r KernelSU-*/uapi drivers/kernelsu/
          sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|' drivers/kernelsu/feature/sucompat.c
          # Kernel 5.4 lacks strncpy_from_user_nofault: add fallback in sucompat.c
          python3 - <<'PYEOF'
          path = 'drivers/kernelsu/feature/sucompat.c'
          s = open(path).read()
          fallback = """
          /* 5.4 compat: strncpy_from_user_nofault fallback */
          #ifndef HAVE_STRNCPY_FROM_USER_NOFAULT
          static long strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)
          {
              long res;
              if (unlikely(count <= 0))
                  return 0;
              pagefault_disable();
              res = strncpy_from_user(dst, unsafe_addr, count);
              pagefault_enable();
              return res;
          }
          #endif
          """
          if 'strncpy_from_user_nofault fallback' not in s:
              s = s.replace('#define SU_PATH "/system/bin/su"', fallback + '\n#define SU_PATH "/system/bin/su"')
              open(path, 'w').write(s)
          PYEOF
          # Kernel 5.4 lacks copy_to_kernel_nofault: add fallback in patch_memory.c
          python3 - <<'PYEOF'
          pm = 'drivers/kernelsu/hook/arm64/patch_memory.c'
          s = open(pm).read()
          if 'copy_to_kernel_nofault' in s and '5.4 compat' not in s:
              s = s.replace('#include "klog.h" // IWYU pragma: keep', '#include "klog.h" // IWYU pragma: keep\n\n/* 5.4 compat: copy_to_kernel_nofault fallback */\n#ifndef HAVE_COPY_TO_KERNEL_NOFAULT\nstatic inline long copy_to_kernel_nofault(void *dst, const void *src, size_t size)\n{\n    return probe_kernel_write(dst, src, size);\n}\n#endif', 1)
              open(pm, 'w').write(s)
          PYEOF
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev make python3 zip libncurses-dev binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu clang lld llvm
      - name: Build kernel
        run: |
          cd kernel
          bash build.sh all
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: out/anykernel/*.zip
