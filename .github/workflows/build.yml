name: Build KSU kernel for star (Mi 11 Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source (miui-base)
        run: |
          git clone --depth 1 --branch miui-base https://github.com/EndCredits/android_kernel_xiaomi_sm8350-miui.git kernel
          cd kernel
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/star_defconfig
          wget -q https://codeload.github.com/tiann/KernelSU/tar.gz/refs/tags/v3.2.5 -O ksu.tar.gz
          tar -xzf ksu.tar.gz
          rm -rf drivers/kernelsu; mkdir -p drivers/kernelsu
          cp -r KernelSU-*/kernel/. drivers/kernelsu/
          cp -r KernelSU-*/uapi drivers/kernelsu/
          sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|' drivers/kernelsu/feature/sucompat.c
          # Kernel 5.4 compatibility: add fallbacks for missing nofault APIs
          python3 - <<'PYEOF'
          import os
          STRN = """
          /* 5.4 compat: strncpy_from_user_nofault fallback */
          #ifndef HAVE_STRNCPY_FROM_USER_NOFAULT
          static long strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)
          {
              long res;
              if (unlikely(count <= 0))
                  return 0;
              pagefault_disable();
              res = strncpy_from_user(dst, unsafe_addr, count);
              pagefault_enable();
              return res;
          }
          #endif
          """
          CPY = """
          /* 5.4 compat: copy_to_kernel_nofault fallback */
          #ifndef HAVE_COPY_TO_KERNEL_NOFAULT
          static inline long copy_to_kernel_nofault(void *dst, const void *src, size_t size)
          {
              pagefault_disable();
              memcpy(dst, src, size);
              pagefault_enable();
              return 0;
          }
          #endif
          """
          for root, dirs, files in os.walk('drivers/kernelsu'):
              for fn in files:
                  if not fn.endswith('.c'):
                      continue
                  fp = os.path.join(root, fn)
                  src = open(fp).read()
                  lines = src.split('\n')
                  last_inc = -1
                  for idx, ln in enumerate(lines):
                      if ln.startswith('#include'):
                          last_inc = idx
                  if 'strncpy_from_user_nofault' in src and 'strncpy_from_user_nofault fallback' not in src and last_inc >= 0:
                      lines.insert(last_inc + 1, STRN)
                      open(fp, 'w').write('\n'.join(lines))
                      print('patched', fp, 'STRN')
                  if 'copy_to_kernel_nofault' in src and 'copy_to_kernel_nofault fallback' not in src and last_inc >= 0:
                      lines2 = open(fp).read().split('\n')
                      last_inc2 = max(i2 for i2, ln2 in enumerate(lines2) if ln2.startswith('#include'))
                      lines2.insert(last_inc2 + 1, CPY)
                      open(fp, 'w').write('\n'.join(lines2))
                      print('patched', fp, 'CPY')
          PYEOF
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev make python3 zip libncurses-dev binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu clang lld llvm
      - name: Build kernel
        run: |
          cd kernel
          bash build.sh all
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: out/anykernel/*.zip